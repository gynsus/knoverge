packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts; pnpm blocks all others.
allowBuilds:
  esbuild: true

# Supply-chain policy: refuse package versions published less than two days ago.
minimumReleaseAge: 2880

catalog:
  '@eslint/js': 10.0.1
  '@types/node': 24.13.5
  '@types/pg': 8.23.1
  commander: 15.0.0
  eslint: 10.10.0
  eslint-config-prettier: 10.1.8
  fastify: 5.12.5
  globals: 17.12.0
  pg: 8.23.0
  pino: 10.3.1
  pino-pretty: 13.1.3
  prettier: 3.9.7
  tsup: 8.5.1
  tsx: 4.23.13
  turbo: 2.10.12
  typescript: 5.9.3
  typescript-eslint: 8.70.0
  vitest: 5.0.1
  zod: 4.6.5
