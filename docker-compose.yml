name: knoverge

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${KNOVERGE_POSTGRES_DB:-knoverge}
      POSTGRES_USER: ${KNOVERGE_POSTGRES_USER:-knoverge}
      POSTGRES_PASSWORD: ${KNOVERGE_POSTGRES_PASSWORD:?set a database password in .env}
    volumes:
      - knoverge-postgres:/var/lib/postgresql/data
    # The application reaches the database over the compose network, so nothing
    # is published by default. Uncomment to connect a client from the host, and
    # keep the binding on the loopback address.
    # ports:
    #   - '127.0.0.1:${KNOVERGE_POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  knoverge:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    image: knoverge:local
    environment:
      KNOVERGE_PORT: 3000
      KNOVERGE_HOST: 0.0.0.0
      KNOVERGE_ROLE: ${KNOVERGE_ROLE:-all}
      KNOVERGE_DATABASE_URL: postgres://${KNOVERGE_POSTGRES_USER:-knoverge}:${KNOVERGE_POSTGRES_PASSWORD:?set a database password in .env}@postgres:5432/${KNOVERGE_POSTGRES_DB:-knoverge}
      KNOVERGE_DATA_DIR: /data
      # A volume of its own, beside the data rather than inside it: the archive
      # is made of the data directory, so a backup written there would be
      # inside the next one (ADR 0040). Nothing is copied until an operator
      # turns backups on in Settings.
      KNOVERGE_BACKUP_DIR: /backups
      KNOVERGE_LEDGER_KEY: ${KNOVERGE_LEDGER_KEY:?Set KNOVERGE_LEDGER_KEY in .env (openssl rand -hex 32)}
      # Empty unless the operator has rotated, and empty unless a webhook exists.
      KNOVERGE_LEDGER_KEY_RETIRED: ${KNOVERGE_LEDGER_KEY_RETIRED:-}
      KNOVERGE_ENCRYPTION_KEY: ${KNOVERGE_ENCRYPTION_KEY:-}
      KNOVERGE_SESSION_SECRET: ${KNOVERGE_SESSION_SECRET:?Set KNOVERGE_SESSION_SECRET in .env (openssl rand -hex 32)}
      KNOVERGE_TOKEN_PEPPER: ${KNOVERGE_TOKEN_PEPPER:?Set KNOVERGE_TOKEN_PEPPER in .env (openssl rand -hex 32)}
      KNOVERGE_BASE_URL: ${KNOVERGE_BASE_URL:-http://localhost:3000}
      KNOVERGE_LOG_LEVEL: ${KNOVERGE_LOG_LEVEL:-info}
      KNOVERGE_TRUST_PROXY: ${KNOVERGE_TRUST_PROXY:-false}
      KNOVERGE_AUTO_MIGRATE: ${KNOVERGE_AUTO_MIGRATE:-true}
    volumes:
      - knoverge-data:/data
      - knoverge-backups:/backups
    ports:
      - '${KNOVERGE_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Not started by default: a complete installation is one application container
  # plus PostgreSQL (rule 10), and an operator with a proxy already in front
  # should not be handed a second one. Start it with
  # `docker compose --profile proxy up -d`, and take the application's own port
  # mapping away so it is reachable only through this.
  caddy:
    image: caddy:2-alpine
    profiles: ['proxy']
    ports:
      - '${KNOVERGE_HTTP_PORT:-80}:80'
      - '${KNOVERGE_HTTPS_PORT:-443}:443'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      knoverge:
        condition: service_started
    restart: unless-stopped

# Declared external so that `docker compose down -v` cannot remove them.
# Compose only deletes volumes it created, and these are created once by hand:
#
#     docker volume create knoverge-postgres
#     docker volume create knoverge-data
#     docker volume create knoverge-backups
#
# The cost is that first run needs those three commands, and that wiping an
# installation on purpose is an explicit `docker volume rm`. That is the right
# way round: losing a knowledge base should take more typing than keeping it.
volumes:
  knoverge-postgres:
    external: true
    name: ${KNOVERGE_POSTGRES_VOLUME:-knoverge-postgres}
  knoverge-data:
    external: true
    name: ${KNOVERGE_DATA_VOLUME:-knoverge-data}
  knoverge-backups:
    external: true
    name: ${KNOVERGE_BACKUP_VOLUME:-knoverge-backups}
  # Compose's own, unlike the three above: what is in them — a certificate and an
  # account key — is recoverable by asking for a certificate again, so losing them
  # costs a renewal rather than a knowledge base.
  caddy-data:
  caddy-config:
