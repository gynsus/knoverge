# Publishing a release image.
#
# Separate from ci.yml on purpose: that workflow builds the image on every pull
# request and throws it away, which is what keeps the Dockerfile honest. This one
# runs for a tag, pushes, and does nothing else — so a change to how releases are
# published cannot break the checks a pull request depends on.
name: release

on:
  push:
    tags: ['v*']
  # For a rebuild of a tag that was already cut, when the publish failed rather
  # than the build.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, for example v0.1.0'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Read the version from the tag
        id: version
        run: |
          ref='${{ inputs.tag || github.ref_name }}'
          version="${ref#v}"
          # The tag is the version, so a malformed one stops the release rather
          # than publishing an image that calls itself something nobody chose.
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || {
            echo "not a version tag: $ref"; exit 1;
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A prerelease does not become `latest`: somebody pulling without a tag
          # is asking for the current release, not for the next one being tried.
          case "$version" in *-*) echo 'prerelease=true' >> "$GITHUB_OUTPUT" ;;
            *) echo 'prerelease=false' >> "$GITHUB_OUTPUT" ;; esac

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          # arm64 as well as amd64: a self-hosted installation is as likely to be
          # somebody's own small machine as a cloud instance.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            KNOVERGE_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.prerelease == 'false' && format('ghcr.io/{0}:latest', github.repository) || '' }}
          labels: |
            org.opencontainers.image.title=Knoverge
            org.opencontainers.image.description=A knowledge ledger for humans and AI agents
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what was published, and that it says its own version
        run: |
          image='ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}'
          docker run --rm --entrypoint knoverge "$image" --version
          echo "published $image"
